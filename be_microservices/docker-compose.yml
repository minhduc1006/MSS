services:
  gateway-service:
    build:
      context: ./gateway-service
    environment:
      AUTH_SERVICE_URI: http://auth-service:8081
      BILLING_SERVICE_URI: http://billing-service:8082
      FACILITY_SERVICE_URI: http://facility-service:8083
      SECURITY_SERVICE_URI: http://security-service:8084
      OPERATIONS_SERVICE_URI: http://operations-service:8085
    depends_on:
      - auth-service
      - billing-service
      - facility-service
      - security-service
      - operations-service
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16
    container_name: mss-microservices-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth-service:
    build:
      context: ./auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mss_auth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_PORTAL_URL: ${APP_PORTAL_URL:-http://localhost:3000}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      SECURITY_MAIL_FROM: ${SECURITY_MAIL_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  billing-service:
    build:
      context: ./billing-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mss_billing
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_PORTAL_URL: ${APP_PORTAL_URL:-http://localhost:3000}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      INVOICE_MAIL_FROM: ${INVOICE_MAIL_FROM:-}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"

  facility-service:
    build:
      context: ./facility-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mss_facility
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"

  security-service:
    build:
      context: ./security-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mss_security
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8084:8084"

  operations-service:
    build:
      context: ./operations-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mss_operations
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"

volumes:
  postgres_data:
