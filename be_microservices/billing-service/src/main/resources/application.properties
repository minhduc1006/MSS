spring.application.name=billing-service
server.port=8082
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mss_billing}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jackson.serialization.write-dates-as-timestamps=false
app.portal-url=${APP_PORTAL_URL:http://localhost:3000}
auth.service.base-url=${AUTH_SERVICE_BASE_URL:http://localhost:8081/api}
invoice.mail.from=${INVOICE_MAIL_FROM:${SPRING_MAIL_USERNAME:no-reply@skyline.local}}
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.return-url=${PAYOS_RETURN_URL:}
payos.cancel-url=${PAYOS_CANCEL_URL:}
