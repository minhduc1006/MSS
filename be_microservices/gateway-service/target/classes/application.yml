spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOriginPatterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                  - "http://10.0.2.2:*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                exposedHeaders:
                  - "*"
                allowCredentials: true
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: billing-service
              uri: ${BILLING_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/billing/**,/api/apartments/**,/api/tenancies/**,/api/utilities/**
            - id: facility-service
              uri: ${FACILITY_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/facilities/**,/api/bookings/**,/api/announcements/**
            - id: security-service
              uri: ${SECURITY_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/security/**
            - id: operations-service
              uri: ${OPERATIONS_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/api/operations/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
